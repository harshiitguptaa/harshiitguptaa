<svg width="700" height="240" viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061109"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer glowing frame -->
  <rect x="2" y="2" width="696" height="236" rx="14" fill="url(#bgGrad)" stroke="#39FF14" stroke-width="1.4">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- title bar -->
  <rect x="2" y="2" width="696" height="30" rx="14" fill="#0b1512"/>
  <rect x="2" y="20" width="696" height="12" fill="#0b1512"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="350" y="21" fill="#6b8f74" font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="middle">harshit@security-terminal:~</text>

  <!-- scanline sweep -->
  <rect x="2" y="32" width="696" height="4" fill="#39FF14" opacity="0.08">
    <animate attributeName="y" values="32;200;32" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal lines -->
  <g font-family="Fira Code, Consolas, monospace" font-size="15" fill="#39FF14" filter="url(#glow)">
    <text x="24" y="62" opacity="0">$ whoami
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="24" y="88" opacity="0">&gt; harshit_gupta — aspiring appsec &amp; cloud security engineer
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
    </text>
    <text x="24" y="114" opacity="0">$ nmap -sV --top-ports 20 skills
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.2s" fill="freeze"/>
    </text>
    <text x="24" y="140" opacity="0">PORT   STATE  SERVICE   Java | Spring Boot | Linux | Git
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.1s" fill="freeze"/>
    </text>
    <text x="24" y="166" opacity="0">$ cat philosophy.txt
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.2s" fill="freeze"/>
    </text>
    <text x="24" y="192" opacity="0">"Breaking things to learn how to protect them."
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="5s" fill="freeze"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="24" y="200" width="10" height="16" fill="#39FF14" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1s" begin="5.6s" repeatCount="indefinite"/>
  </rect>
</svg>
