<svg width="700" height="290" viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d7a2e"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061109"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="696" height="286" rx="14" fill="url(#bgGrad2)" stroke="#39FF14" stroke-width="1.4">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="24" y="38" fill="#39FF14" font-family="Fira Code, Consolas, monospace" font-size="16" filter="url(#glow2)">~/skills --verbose</text>
  <line x1="24" y1="48" x2="676" y2="48" stroke="#1f3d27" stroke-width="1"/>

  <!-- Row 1: Penetration Testing 70% -->
  <text x="24" y="76" fill="#c9f7d1" font-family="Consolas, monospace" font-size="13">Penetration Testing</text>
  <rect x="230" y="63" width="446" height="14" rx="7" fill="#132118"/>
  <rect x="230" y="63" width="0" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow2)">
    <animate attributeName="width" from="0" to="312" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="686" y="74" fill="#39FF14" font-family="Consolas, monospace" font-size="12" text-anchor="end" opacity="0">70%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- Row 2: Python & Scapy 78% -->
  <text x="24" y="118" fill="#c9f7d1" font-family="Consolas, monospace" font-size="13">Python &amp; Scapy</text>
  <rect x="230" y="105" width="446" height="14" rx="7" fill="#132118"/>
  <rect x="230" y="105" width="0" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow2)">
    <animate attributeName="width" from="0" to="348" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="686" y="116" fill="#39FF14" font-family="Consolas, monospace" font-size="12" text-anchor="end" opacity="0">78%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
  </text>

  <!-- Row 3: Network Security 65% -->
  <text x="24" y="160" fill="#c9f7d1" font-family="Consolas, monospace" font-size="13">Network Security</text>
  <rect x="230" y="147" width="446" height="14" rx="7" fill="#132118"/>
  <rect x="230" y="147" width="0" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow2)">
    <animate attributeName="width" from="0" to="290" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="686" y="158" fill="#39FF14" font-family="Consolas, monospace" font-size="12" text-anchor="end" opacity="0">65%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
  </text>

  <!-- Row 4: Automation & Scripting 72% -->
  <text x="24" y="202" fill="#c9f7d1" font-family="Consolas, monospace" font-size="13">Automation &amp; Scripting</text>
  <rect x="230" y="189" width="446" height="14" rx="7" fill="#132118"/>
  <rect x="230" y="189" width="0" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow2)">
    <animate attributeName="width" from="0" to="321" dur="1.6s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="686" y="200" fill="#39FF14" font-family="Consolas, monospace" font-size="12" text-anchor="end" opacity="0">72%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
  </text>

  <!-- Row 5: Cloud Security (learning) 40% -->
  <text x="24" y="244" fill="#c9f7d1" font-family="Consolas, monospace" font-size="13">Cloud Security (learning)</text>
  <rect x="230" y="231" width="446" height="14" rx="7" fill="#132118"/>
  <rect x="230" y="231" width="0" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow2)">
    <animate attributeName="width" from="0" to="178" dur="1.6s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="686" y="242" fill="#39FF14" font-family="Consolas, monospace" font-size="12" text-anchor="end" opacity="0">40%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.3s" fill="freeze"/>
  </text>

  <text x="24" y="272" fill="#4d8a5c" font-family="Consolas, monospace" font-size="11">note: self-assessed, growing weekly ▲</text>
</svg>
